    // Submit New Complaint
    function handleComplaintSubmit(e) {
      e.preventDefault();
      const db = getDB();

      const name = document.getElementById('comp-name').value.trim();
      const contact = document.getElementById('comp-contact').value.trim();
      const email = document.getElementById('comp-email').value.trim();
      const studentId = document.getElementById('comp-studentid').value.trim();
      const building = document.getElementById('comp-building').value.trim();
      const room = document.getElementById('comp-room').value.trim();
      const category = document.getElementById('comp-category').value;
      const subCategory = document.getElementById('comp-subcategory').value;
      const priority = document.getElementById('comp-priority').value;
      const preferredContact = document.getElementById('comp-contact-method').value;
      const description = document.getElementById('comp-description').value.trim();

      // Generate Ticket ID
      const count = db.complaints.length + 1;
      const newId = `CF-2026-${String(count).padStart(4, '0')}`;

      const now = new Date();
      const timeStr = now.toLocaleDateString('en-US', { month: 'short', day: '2-digit' }) + ', ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

      // Auto-assign if enabled
      let assignedStaff = 'Unassigned';
      if (db.settings.autoAssignTickets) {
        const matchingStaff = db.staff.find(st => st.dept.toLowerCase().includes(category.toLowerCase()) || category.toLowerCase().includes(st.dept.toLowerCase()));
        if (matchingStaff) assignedStaff = matchingStaff.name;
      }

      const newComplaint = {
        id: newId,
        studentName: name,
        studentId: studentId || 'N/A',
        contact,
        email,
        building,
        room,
        category,
        subCategory,
        priority,
        preferredContact,
        description,
        image: uploadedImageBase64,
        status: assignedStaff !== 'Unassigned' ? 'Assigned' : 'Pending',
        createdAt: timeStr,
        updatedAt: timeStr,
        assignedStaff,
        staffNotes: '',
        timeline: [
          { stage: 'Submitted', time: timeStr, note: 'Complaint logged by student' }
        ]
      };

      if (assignedStaff !== 'Unassigned') {
        newComplaint.timeline.push({ stage: 'Assigned', time: timeStr, note: `Auto-routed to ${assignedStaff}` });
      }

      db.complaints.unshift(newComplaint);
      saveDB(db);

      // Trigger REAL-TIME PUSH NOTIFICATIONS
      // 1. Student notification
      pushRealTimeNotification({
        title: 'New Complaint Registered',
        message: `Ticket ${newId} (${category}) logged for ${building}, ${room}. Status: ${newComplaint.status}.`,
        ticketId: newId,
        targetRole: 'student',
        targetUser: email,
        type: priority === 'Urgent' ? 'urgent' : 'info'
      });

      // 2. Staff notification (if assigned)
      if (assignedStaff !== 'Unassigned') {
        pushRealTimeNotification({
          title: 'Work Order Dispatched: ' + newId,
          message: `Ticket ${newId} assigned to technician ${assignedStaff} at ${building}, ${room}.`,
          ticketId: newId,
          targetRole: 'staff',
          targetUser: assignedStaff,
          type: 'info'
        });
      }

      // 3. Admin notification
      pushRealTimeNotification({
        title: 'New Complaint Logged: ' + newId,
        message: `${name} reported ${category} (${subCategory}) at ${building}, ${room}. Priority: ${priority}.`,
        ticketId: newId,
        targetRole: 'admin',
        type: priority === 'Urgent' ? 'urgent' : 'info'
      });

      // Show Success Screen inside modal
      const formWrapper = document.getElementById('complaint-form-wrapper');
      const successWrapper = document.getElementById('complaint-success-wrapper');
      const detailsCont = document.getElementById('success-ticket-details');
      const trackBtn = document.getElementById('success-track-btn');

      if (detailsCont) {
        detailsCont.innerHTML = `
          <div style="font-size:0.75rem;color:var(--text-muted);font-weight:700;">TRACKING TICKET NUMBER</div>
          <div style="font-family:var(--font-mono);font-size:1.6rem;font-weight:800;color:var(--primary);margin:0.25rem 0 0.75rem 0;">${newId}</div>
          <div style="font-size:0.825rem;line-height:1.5;color:var(--text-main);">
            <strong>Category:</strong> ${escapeHtml(category)} (${escapeHtml(subCategory)})<br />
            <strong>Location:</strong> ${escapeHtml(building)}, ${escapeHtml(room)}<br />
            <strong>Priority:</strong> <span class="priority-${priority.toLowerCase()}">${escapeHtml(priority)}</span><br />
            <strong>Assigned Staff:</strong> ${escapeHtml(assignedStaff)}<br />
            <strong>Status:</strong> <span class="status-badge status-${newComplaint.status.toLowerCase().replace(/\s+/g, '-')}">${newComplaint.status}</span>
          </div>
        `;
      }

      if (trackBtn) {
        trackBtn.onclick = function() {
          closeModal('complaint-modal');
          showTrackModalWithTicket(newId);
        };
      }

      if (formWrapper) formWrapper.style.display = 'none';
      if (successWrapper) successWrapper.style.display = 'block';

      showToast('Complaint Filed', `Ticket ${newId} created successfully!`, 'success');
    }

          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:0.75rem;margin-bottom:1.25rem;border-bottom:1px solid var(--border-color);padding-bottom:1rem;">

              <div style="font-size:0.875rem;font-weight:700;margin-top:0.2rem;">${escapeHtml(c.category)} &middot; ${escapeHtml(c.subCategory || 'Issue')}</div>
              <div style="font-size:0.775rem;color:var(--text-muted);margin-top:0.15rem;">Location: ${escapeHtml(c.building)}, ${escapeHtml(c.room)}</div>

              <div style="font-size:0.75rem;margin-top:0.25rem;"><span class="priority-${c.priority.toLowerCase()}">Priority: ${escapeHtml(c.priority)}</span></div>

            ${renderTimelineLifecycle(c)}

          <!-- Ticket Details Grid -->
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;background:var(--bg-surface-subtle);padding:1rem;border-radius:var(--radius-md);font-size:0.825rem;margin-bottom:1rem;">
            <div><strong>Student:</strong> ${escapeHtml(c.studentName)} (${escapeHtml(c.contact)})</div>
            <div><strong>Date Logged:</strong> ${escapeHtml(c.createdAt)}</div>
            <div><strong>Assigned Staff:</strong> ${c.assignedStaff && c.assignedStaff !== 'Unassigned' ? escapeHtml(c.assignedStaff) : '<span style="color:var(--text-subtle);">Awaiting assignment</span>'}</div>
            <div><strong>Last Updated:</strong> ${escapeHtml(c.updatedAt || c.createdAt)}</div>
          </div>

          <div style="font-size:0.825rem;color:var(--text-main);margin-bottom:0.75rem;">
            <strong>Description:</strong> ${escapeHtml(c.description)}

            <div style="background:var(--primary-subtle);border-left:3px solid var(--primary);padding:0.75rem 1rem;border-radius:var(--radius-md);font-size:0.825rem;color:var(--text-main);margin-top:0.75rem;">

    function renderTimelineLifecycle(ticket) {
      const stages = [
        { key: 'Submitted', label: 'Complaint Submitted', desc: ticket.createdAt },
        { key: 'Assigned', label: 'Assigned to Staff', desc: ticket.assignedStaff !== 'Unassigned' ? ticket.assignedStaff : 'Pending dispatch' },
        { key: 'In Progress', label: 'Work Started / Ongoing', desc: ticket.status === 'In Progress' || ticket.status === 'Resolved' ? 'Inspecting & repairing' : 'Awaiting start' },
        { key: 'Resolved', label: 'Resolution Completed', desc: ticket.status === 'Resolved' ? 'Verified by campus crew' : 'Pending completion' }
      ];

      const statusIndexMap = {
        'Pending': 0,
        'Assigned': 1,
        'In Progress': 2,
        'Resolved': 3,
        'Rejected': 0
      };

      const currentIdx = statusIndexMap[ticket.status] !== undefined ? statusIndexMap[ticket.status] : 0;

      return `
        <div style="display:flex;flex-direction:column;gap:0.75rem;">
          ${stages.map((st, i) => {
            const isCompleted = i <= currentIdx;
            const isActive = i === currentIdx;
            return `
              <div class="timeline-item ${isCompleted ? 'completed' : ''} ${isActive ? 'active' : ''}">
                <div class="timeline-dot"></div>
                <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                  <div>
                    <div style="font-size:0.85rem;font-weight:${isActive ? '700' : '600'};color:${isActive ? 'var(--primary)' : isCompleted ? 'var(--text-main)' : 'var(--text-subtle)'};">
                      ${escapeHtml(st.label)}
                    </div>
                    <div style="font-size:0.75rem;color:var(--text-muted);">${escapeHtml(st.desc)}</div>
                  </div>
                  ${isCompleted ? `<span style="color:var(--success);">${iconSvg('check', 14)}</span>` : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    // Authentication Handlers
    function handleStudentSignIn(e, source = 'modal') {
      if (e) e.preventDefault();
      const prefix = source === 'page' ? 'page-signin-' : 'signin-';
      let idOrEmail = document.getElementById(prefix + 'identifier')?.value.trim();
      let pass = document.getElementById(prefix + 'password')?.value;

      if (!idOrEmail) {
        idOrEmail = document.getElementById('signin-identifier')?.value.trim() ||
                    document.getElementById('page-signin-identifier')?.value.trim();
        pass = document.getElementById('signin-password')?.value ||
               document.getElementById('page-signin-password')?.value;
      }

      if (!idOrEmail || !pass) {
        showToast('Input Required', 'Please enter your campus email or Student ID, and your password.', 'warning');
        return;
      }

      const db = getDB();
      const student = (db.students || []).find(s => 
        s.email.toLowerCase() === idOrEmail.toLowerCase() || 
        s.id.toLowerCase() === idOrEmail.toLowerCase()
      );

      if (!student) {
        showToast('Account Not Found', 'No student account matches this Email or Student ID. Please click "Sign Up" or "Create Account" to register.', 'danger');
        return;
      }

      // Session persistence check
      const rememberInput = document.getElementById(prefix + 'remember') || 
                            document.getElementById('signin-remember') || 
                            document.getElementById('page-signin-remember');
      const shouldRemember = rememberInput ? rememberInput.checked : true;

      if (!shouldRemember) {
        try { sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({ role: 'student', user: student })); } catch (err) {}
        try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (err) {}
        updateNavSession();
      } else {
        setSession('student', student);
      }

      closeModal('auth-modal');
      showToast('Welcome Back!', `Signed in as ${student.name}`, 'success');
      setView('student-dashboard');
    }

    function handleStudentSignUp(e) {
      e.preventDefault();
      const name = document.getElementById('signup-name')?.value.trim() || document.getElementById('page-signup-name')?.value.trim();
      const id = document.getElementById('signup-id')?.value.trim() || document.getElementById('page-signup-id')?.value.trim();
      const email = document.getElementById('signup-email')?.value.trim() || document.getElementById('page-signup-email')?.value.trim();
      const phone = document.getElementById('signup-phone')?.value.trim() || document.getElementById('page-signup-phone')?.value.trim();
      const dept = document.getElementById('signup-dept')?.value.trim() || document.getElementById('page-signup-dept')?.value.trim();
      const year = document.getElementById('signup-year')?.value || document.getElementById('page-signup-year')?.value;
      const password = document.getElementById('signup-password')?.value || document.getElementById('page-signup-password')?.value;
      const confirm = document.getElementById('signup-confirm')?.value || document.getElementById('page-signup-confirm')?.value;

      if (password && confirm && password !== confirm) {
        showToast('Password Error', 'Passwords do not match. Please verify.', 'danger');
        return;
      }

      const db = getDB();
      if (db.students.some(s => s.email.toLowerCase() === email.toLowerCase() || s.id.toLowerCase() === id.toLowerCase())) {
        showToast('Account Exists', 'A student with this Email or Student ID is already registered.', 'danger');
        return;
      }

      const newStudent = { id, name, email, phone, dept, year, status: 'Active', registeredAt: new Date().toISOString().split('T')[0] };
      db.students.push(newStudent);
      saveDB(db);

      setSession('student', newStudent);
      closeModal('auth-modal');
      showToast('Account Created!', `Welcome to Campus Fix, ${name}`, 'success');
      setView('student-dashboard');
    }

    async function handleAdminSignIn(e, source = 'modal') {
      if (e) e.preventDefault();
      const prefix = source === 'page' ? 'page-admin-signin-' : 'admin-signin-';
      let idOrEmail = document.getElementById(prefix + 'identifier')?.value.trim();
      let pass = document.getElementById(prefix + 'password')?.value;

      if (!idOrEmail) {
        idOrEmail = document.getElementById('admin-signin-identifier')?.value.trim() || 
                    document.getElementById('page-admin-signin-identifier')?.value.trim();
        pass = document.getElementById('admin-signin-password')?.value || 
               document.getElementById('page-admin-signin-password')?.value;
      }

      if (!idOrEmail || !pass) {
        showToast('Input Required', 'Please enter your administrator email/ID and secure password.', 'warning');
        return;
      }

      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: idOrEmail, password: pass })
        });
        const data = await response.json();

        if (!data.success) {
          showToast('Authentication Failed', data.error || 'Access denied for this administrator account.', 'danger');
          return;
        }

        // Store secure token and user session
        localStorage.setItem('campusfix_admin_token', data.token);
        setSession('admin', data.admin);

        // Keep local DB sync
        const db = getDB();
        db.admins = db.admins || [];
        const existingIdx = db.admins.findIndex(a => a.email.toLowerCase() === data.admin.email.toLowerCase());
        if (existingIdx >= 0) {
          db.admins[existingIdx] = { ...db.admins[existingIdx], ...data.admin };
        } else {
          db.admins.push(data.admin);
        }
        saveDB(db);

        closeModal('admin-modal');
        showToast('Administrator Authenticated', `Welcome, ${data.admin.name} (${data.admin.designation || 'Admin'})`, 'success');
        setView('admin-dashboard');
      } catch (err) {
        console.error('Admin login error:', err);
        showToast('Server Connection Error', 'Unable to reach backend authentication service. Please check your network.', 'danger');
      }
    }

    async function handleConfigureFriendAdmin(e) {
      if (e) e.preventDefault();
      const name = document.getElementById('friend-name-input')?.value.trim();
      const email = document.getElementById('friend-email-input')?.value.trim();
      const desig = document.getElementById('friend-desig-input')?.value.trim();
      const password = document.getElementById('friend-password-input')?.value;

      if (!name || !email || !password) {
        showToast('Fields Required', 'Please provide Friend Name, Email, and Password.', 'warning');
        return;
      }

      if (password.length < 6) {
        showToast('Password Too Short', 'Password must be at least 6 characters.', 'warning');
        return;
      }

      const token = localStorage.getItem('campusfix_admin_token');
      if (!token) {
        showToast('Session Expired', 'Please re-authenticate as an administrator.', 'danger');
        setView('admin-signin');
        return;
      }

      try {
        const res = await fetch('/api/admin/update-friend', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ name, email, designation: desig, password })
        });
        const data = await res.json();

        if (!data.success) {
          showToast('Update Failed', data.error || 'Could not update friend account.', 'danger');
          return;
        }

        const db = getDB();
        db.admins = db.admins || [];
        const friendIdx = db.admins.findIndex(a => !a.isPrimary || a.id === 'ADM-FRIEND-02');
        if (friendIdx >= 0) {
          db.admins[friendIdx] = { ...db.admins[friendIdx], name, email, designation: desig, isPrimary: false };
        } else {
          db.admins.push({ id: 'ADM-FRIEND-02', name, email, designation: desig, isPrimary: false });
        }
        saveDB(db);

        showToast('Friend Account Configured', `Second administrator ${name} (${email}) is now authorized with secure PBKDF2 hashing.`, 'success');
        renderApp();
      } catch (err) {
        console.error('Configure friend error:', err);
        showToast('Network Error', 'Failed to update friend administrator account.', 'danger');
      }
    }

      openModal('assign-staff-modal');
    }

    function handleAssignStaffSubmit(e) {
      e.preventDefault();
      const ticketId = document.getElementById('assign-ticket-id').value;
      const staffName = document.getElementById('assign-staff-select').value;
      const notes = document.getElementById('assign-notes').value.trim();
      const db = getDB();

      const ticket = db.complaints.find(c => c.id === ticketId);
      if (ticket) {
        ticket.assignedStaff = staffName;
        ticket.status = 'Assigned';
        ticket.updatedAt = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        ticket.timeline.push({
          stage: 'Assigned',
          time: ticket.updatedAt,
          note: `Assigned to ${staffName}. ${notes}`
        });
        saveDB(db);

        // REAL-TIME PUSH NOTIFICATIONS TO ALL 3 PARTIES (STUDENT, STAFF, ADMIN)
        // 1. Student notification
        pushRealTimeNotification({
          title: 'Staff Assigned: ' + ticketId,
          message: `Technician ${staffName} has been assigned to your ticket (${ticket.category}).`,
          ticketId,
          targetRole: 'student',
          targetUser: ticket.email,
          type: 'info'
        });

        // 2. Staff notification
        pushRealTimeNotification({
          title: 'New Work Assignment: ' + ticketId,
          message: `You were assigned ticket ${ticketId} at ${ticket.building}, ${ticket.room}.`,
          ticketId,
          targetRole: 'staff',
          targetUser: staffName,
          type: 'info'
        });

        // 3. Admin notification
        pushRealTimeNotification({
          title: 'Work Order Dispatched: ' + ticketId,
          message: `Ticket ${ticketId} (${ticket.category}) dispatched to technician ${staffName}.`,
          ticketId,
          targetRole: 'admin',
          type: 'info'
        });

        closeModal('assign-staff-modal');
        showToast('Staff Dispatched', `${staffName} assigned to ${ticketId}`, 'success');
        renderApp();
      }
    }

    // Status Update Modal Handlers
    function openStatusUpdateModal(ticketId) {
      const idInp = document.getElementById('status-ticket-id');
      const idDisp = document.getElementById('status-ticket-id-display');
      if (idInp) idInp.value = ticketId;
      if (idDisp) idDisp.textContent = ticketId;
      openModal('status-update-modal');
    }

    function toggleResolutionNoteRequirement(status) {
      const warning = document.getElementById('status-notes-warning');
      const input = document.getElementById('status-notes-input');
      if (status === 'Resolved') {
        if (warning) warning.style.display = 'block';
        if (input) input.placeholder = 'Required: Document what was repaired or replaced...';
      } else {
        if (warning) warning.style.display = 'none';
        if (input) input.placeholder = 'Describe actions taken or updates...';
      }
    }

    function handleStatusUpdateSubmit(e) {
      e.preventDefault();
      const ticketId = document.getElementById('status-ticket-id').value;
      const status = document.getElementById('status-select').value;
      const notes = document.getElementById('status-notes-input').value.trim();

      if (status === 'Resolved' && !notes) {
        showToast('Resolution Note Required', 'Please provide a completion note explaining the fix.', 'danger');
        return;
      }

      const db = getDB();
      const ticket = db.complaints.find(c => c.id === ticketId);
      if (ticket) {
        ticket.status = status;
        if (notes) ticket.staffNotes = notes;
        ticket.updatedAt = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        ticket.timeline.push({
          stage: status,
          time: ticket.updatedAt,
          note: notes || `Status updated to ${status}`
        });
        saveDB(db);

        // REAL-TIME PUSH NOTIFICATIONS TO ALL 3 PARTIES (STUDENT, ASSIGNED STAFF, ADMIN)
        // 1. Student notification
        pushRealTimeNotification({
          title: status === 'Resolved' ? `Ticket Resolved: ${ticketId}` : `Ticket ${ticketId} Status: ${status}`,
          message: status === 'Resolved' 
            ? `Your complaint (${ticket.category} at ${ticket.building}) has been marked Resolved. Resolution note: ${notes || 'Repair completed successfully.'}`
            : `Your complaint status was updated to ${status}. ${notes ? 'Note: ' + notes : ''}`,
          ticketId,
          targetRole: 'student',
          targetUser: ticket.email,
          type: status === 'Resolved' ? 'success' : status === 'Rejected' ? 'urgent' : 'info'
        });

        // 2. Assigned Staff notification
        if (ticket.assignedStaff && ticket.assignedStaff !== 'Unassigned') {
          pushRealTimeNotification({
            title: status === 'Resolved' ? `Work Order Completed: ${ticketId}` : `Work Order Update: ${ticketId}`,
            message: status === 'Resolved'
              ? `Ticket ${ticketId} has been marked Resolved. Completion note: ${notes || 'Work verified.'}`
              : `Ticket ${ticketId} status changed to ${status}. ${notes ? 'Note: ' + notes : ''}`,
            ticketId,
            targetRole: 'staff',
            targetUser: ticket.assignedStaff,
            type: status === 'Resolved' ? 'success' : 'info'
          });
        }

        // 3. Admin notification
        pushRealTimeNotification({
          title: status === 'Resolved' ? `Resolution Closed: ${ticketId}` : `Ticket Status: ${ticketId}`,
          message: status === 'Resolved'
            ? `Ticket ${ticketId} (${ticket.category} at ${ticket.building}) marked Resolved. ${notes ? 'Resolution: ' + notes : ''}`
            : `Ticket ${ticketId} status updated to ${status}. ${notes ? 'Note: ' + notes : ''}`,
          ticketId,
          targetRole: 'admin',
          type: status === 'Resolved' ? 'success' : status === 'Rejected' ? 'urgent' : 'info'
        });

        closeModal('status-update-modal');
        showToast('Status Updated', `Ticket ${ticketId} updated to ${status}`, 'success');
        renderApp();
      }
    }

    // Staff Direct Action Handlers
    function updateTicketStatusFromStaff(ticketId, newStatus) {
      const db = getDB();
      const ticket = db.complaints.find(c => c.id === ticketId);
      if (ticket) {
        ticket.status = newStatus;
        ticket.updatedAt = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        ticket.timeline.push({
          stage: newStatus,
          time: ticket.updatedAt,
          note: `Technician accepted work order and commenced inspection.`
        });
        saveDB(db);

        // REAL-TIME PUSH NOTIFICATIONS TO ALL 3 PARTIES (STUDENT, STAFF, ADMIN)
        // 1. Student notification
        pushRealTimeNotification({
          title: `Work Commenced on ${ticketId}`,
          message: `Technician ${ticket.assignedStaff} is on site and has started work on your ticket.`,
          ticketId,
          targetRole: 'student',
          targetUser: ticket.email,
          type: 'info'
        });

        // 2. Staff notification
        pushRealTimeNotification({
          title: `Work Order Accepted: ${ticketId}`,
          message: `You started work order ${ticketId} at ${ticket.building}, ${ticket.room}.`,
          ticketId,
          targetRole: 'staff',
          targetUser: ticket.assignedStaff,
          type: 'info'
        });

        // 3. Admin notification
        pushRealTimeNotification({
          title: `Technician On Site: ${ticketId}`,
          message: `Technician ${ticket.assignedStaff} started inspection on ${ticketId} (${ticket.category}).`,
          ticketId,
          targetRole: 'admin',
          type: 'info'
        });

        showToast('Work Commenced', `Ticket ${ticketId} marked In Progress`, 'info');
        renderApp();
      }
    }

    function openResolveModalForStaff(ticketId) {
      openStatusUpdateModal(ticketId);
      const statusSelect = document.getElementById('status-select');
      if (statusSelect) {
        statusSelect.value = 'Resolved';
        toggleResolutionNoteRequirement('Resolved');
      }
    }

    function updateTicketPriority(ticketId, priority) {
      const db = getDB();
      const ticket = db.complaints.find(c => c.id === ticketId);
      if (ticket) {
        ticket.priority = priority;
        ticket.updatedAt = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        ticket.timeline.push({
          stage: 'Priority Changed',
          time: ticket.updatedAt,
          note: `Priority escalated to ${priority}`
        });
        saveDB(db);
        showToast('Priority Updated', `Ticket ${ticketId} set to ${priority}`, 'info');

        // Multi-party real-time push alerts
        // 1. Admin
        pushRealTimeNotification({
          title: `Priority Updated: ${ticketId}`,
          message: `Ticket ${ticketId} (${ticket.category}) priority set to ${priority}.`,
          ticketId,
          targetRole: 'admin',
          type: priority === 'Urgent' ? 'urgent' : 'info'
        });

        // 2. Assigned Staff
        if (ticket.assignedStaff && ticket.assignedStaff !== 'Unassigned') {
          pushRealTimeNotification({
            title: `Priority Alert: ${ticketId}`,
            message: `Work order ${ticketId} priority set to ${priority}.`,
            ticketId,
            targetRole: 'staff',
            targetUser: ticket.assignedStaff,
            type: priority === 'Urgent' ? 'urgent' : 'info'
          });
        }

        // 3. Student
        if (ticket.email) {
          pushRealTimeNotification({
            title: `Priority Updated: ${ticketId}`,
            message: `Your ticket ${ticketId} priority is now marked as ${priority}.`,
            ticketId,
            targetRole: 'student',
            targetUser: ticket.email,
            type: priority === 'Urgent' ? 'urgent' : 'info'
          });
        }
      }
    }

    function deleteTicketConfirm(ticketId) {
      if (confirm(`Are you sure you want to delete maintenance ticket ${ticketId}? This action cannot be undone.`)) {
        const db = getDB();
        db.complaints = db.complaints.filter(c => c.id !== ticketId);
        saveDB(db);
        showToast('Ticket Deleted', `Ticket ${ticketId} was removed from records.`, 'info');
        renderApp();
      }
    }

    function toggleStudentAccountStatus(studentId) {
      const db = getDB();
      const s = db.students.find(x => x.id === studentId);
      if (s) {
        s.status = s.status === 'Active' ? 'Suspended' : 'Active';
        saveDB(db);
        showToast('Account Updated', `Student ${s.name} is now ${s.status}`, 'info');
        renderApp();
      }
    }

    function handleAddStaffSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('add-staff-name').value.trim();
      const dept = document.getElementById('add-staff-dept').value;
      const spec = document.getElementById('add-staff-spec').value.trim();
      const phone = document.getElementById('add-staff-phone').value.trim();
      const email = document.getElementById('add-staff-email').value.trim();
      const db = getDB();

      const newStaff = {
        id: 'STF-' + String(db.staff.length + 1).padStart(2, '0'),
        name,
        dept,
        spec,
        phone,
        email,
        status: 'Available'
      };

      db.staff.push(newStaff);
      saveDB(db);
      closeModal('add-staff-modal');
      showToast('Staff Added', `Technician ${name} added to roster`, 'success');
      renderApp();
    }

    function deleteStaffMember(staffId) {
      if (confirm('Are you sure you want to remove this staff member?')) {
        const db = getDB();
        db.staff = db.staff.filter(s => s.id !== staffId);
        saveDB(db);
        showToast('Staff Removed', 'Technician removed from system', 'info');
        renderApp();
      }
    }

    function handleAddCategorySubmit(e) {
      e.preventDefault();
      const name = document.getElementById('add-cat-name').value.trim();
      const icon = document.getElementById('add-cat-icon').value;
      const sub = document.getElementById('add-cat-sub').value.split(',').map(s => s.trim()).filter(Boolean);
      const db = getDB();

      const newCat = {
        id: 'cat-' + Date.now(),
        name,
        icon,
        sub: sub.length > 0 ? sub : ['General Repair']
      };

      db.categories.push(newCat);
      saveDB(db);
      closeModal('add-category-modal');
      showToast('Category Created', `Added category: ${name}`, 'success');
      renderApp();
    }

    function deleteCategory(catId) {
      if (confirm('Delete this complaint category?')) {
        const db = getDB();
        db.categories = db.categories.filter(c => c.id !== catId);
        saveDB(db);
        showToast('Category Deleted', 'Category removed from form options', 'info');
        renderApp();
      }
    }

    function handleSaveSettings(e) {
      e.preventDefault();
      const campusName = document.getElementById('setting-campus-name').value.trim();
      const supportEmail = document.getElementById('setting-support-email').value.trim();
      const supportPhone = document.getElementById('setting-support-phone').value.trim();
      const studentRegistrationOpen = document.getElementById('setting-reg-open').checked;
      const autoAssignTickets = document.getElementById('setting-auto-assign').checked;

      const db = getDB();
      db.settings = { campusName, supportEmail, supportPhone, studentRegistrationOpen, autoAssignTickets };
      saveDB(db);
      showToast('Settings Saved', 'System configuration updated successfully', 'success');
      renderApp();
    }

    function resetPrototypeToDefault() {
      if (confirm('Reset entire prototype database back to factory demo state? All custom complaints and accounts will be restored.')) {
        localStorage.removeItem(APP_STORAGE_KEY);
        showToast('Database Reset', 'Demo data reinitialized', 'info');
        location.reload();
      }
    }

    function bindFormEvents() {
      // Any dynamic DOM binds after render
    }

    // App Initialization
    function initApp() {
      initTheme();
      getDB(); // Ensure db initialized
      renderApp();

      // Check hash for direct routing
      const hash = window.location.hash;
      if (hash === '#student') setView('student-dashboard');
      else if (hash === '#staff') setView('staff-dashboard');
      else if (hash === '#admin') setView('admin-dashboard');
      else if (hash === '#track') setView('track-complaint');
      else if (hash === '#history') setView('complaint-history');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
