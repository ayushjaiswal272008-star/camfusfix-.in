<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Fix | GNIOT Group of Institutions — Campus Maintenance &amp; ERP Tracking System</title>
  <meta name="description" content="GNIOT Group of Institutions Official Campus Maintenance Complaint &amp; ERP Tracking System for students, staff, and administrators." />
  <meta property="og:title" content="Campus Fix | GNIOT Group of Institutions — Campus Maintenance &amp; ERP Tracking System" />
  <meta property="og:description" content="GNIOT Group of Institutions Official Campus Maintenance Complaint &amp; ERP Tracking System." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --bg-page: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-subtle: #f1f5f9;
      --border-color: #e2e8f0;
      --border-focus: #3b82f6;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --primary-subtle: #eff6ff;
      --accent: #d97706;
      --accent-subtle: #fef3c7;
      --success: #16a34a;
      --success-subtle: #dcfce7;
      --warning: #ea580c;
      --warning-subtle: #ffedd5;
      --danger: #dc2626;
      --danger-subtle: #fee2e2;
      --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.04);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 20px;
    }

    html.dark {
      --bg-page: #0b1120;
      --bg-surface: #111827;
      --bg-surface-subtle: #1e293b;
      --border-color: #334155;
      --border-focus: #60a5fa;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-subtle: rgba(59, 130, 246, 0.15);
      --accent: #f59e0b;
      --accent-subtle: rgba(245, 158, 11, 0.15);
      --success: #22c55e;
      --success-subtle: rgba(34, 197, 94, 0.15);
      --warning: #f97316;
      --warning-subtle: rgba(249, 115, 22, 0.15);
      --danger: #ef4444;
      --danger-subtle: rgba(239, 68, 68, 0.15);
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      position: relative;
    }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    #app {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    img, svg {
      max-width: 100%;
      height: auto;
    }

    .tabular-nums { font-variant-numeric: tabular-nums; }
    .font-mono { font-family: var(--font-mono); }
    
    /* Layout utilities */
    .container-custom {
      width: 100%;
      max-width: 1240px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 1.25rem;
      padding-right: 1.25rem;
      box-sizing: border-box;
    }
    @media (max-width: 640px) {
      .container-custom {
        padding-left: 1rem;
        padding-right: 1rem;
      }
    }
    @media (max-width: 360px) {
      .container-custom {
        padding-left: 0.75rem;
        padding-right: 0.75rem;
      }
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.55rem 1.1rem;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      text-decoration: none;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-secondary {
      background-color: var(--bg-surface);
      color: var(--text-main);
      border-color: var(--border-color);
    }
    .btn-secondary:hover { background-color: var(--bg-surface-subtle); }
    .btn-accent {
      background-color: var(--accent);
      color: #ffffff;
    }
    .btn-accent:hover { filter: brightness(1.1); }
    .btn-danger {
      background-color: var(--danger);
      color: #ffffff;
    }
    .btn-danger:hover { filter: brightness(0.9); }
    .btn-subtle {
      background-color: var(--primary-subtle);
      color: var(--primary);
    }
    .btn-subtle:hover { filter: brightness(0.95); }
    .btn-sm {
      font-size: 0.775rem;
      padding: 0.35rem 0.75rem;
    }

    /* Cards */
    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      transition: all 0.2s ease;
    }
    .card-hover:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
    }

    /* Forms */
    .form-group { margin-bottom: 1rem; }
    .form-label {
      display: block;
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.35rem;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 0.6rem 0.85rem;
      font-size: 0.875rem;
      font-family: inherit;
      color: var(--text-main);
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    }

    /* Badges */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: var(--radius-sm);
      text-transform: capitalize;
    }
    .status-pending { background: var(--warning-subtle); color: var(--warning); }
    .status-assigned { background: var(--primary-subtle); color: var(--primary); }
    .status-in-progress { background: #e0f2fe; color: #0284c7; }
    .dark .status-in-progress { background: rgba(2, 132, 199, 0.2); color: #38bdf8; }
    .status-resolved { background: var(--success-subtle); color: var(--success); }
    .status-rejected { background: var(--danger-subtle); color: var(--danger); }

    .priority-low { color: #64748b; }
    .priority-medium { color: #0284c7; }
    .priority-high { color: #ea580c; font-weight: 600; }
    .priority-urgent { color: #dc2626; font-weight: 700; }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .modal-backdrop.active {
      display: flex;
      opacity: 1;
    }
    .modal-content {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      max-width: 580px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      transform: translateY(12px);
      transition: transform 0.2s ease;
    }
    .modal-backdrop.active .modal-content {
      transform: translateY(0);
    }
    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-body { padding: 1.5rem; }
    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    @media (max-width: 640px) {
      .modal-backdrop {
        padding: 0.5rem;
      }
      .modal-content {
        max-height: 95vh;
        border-radius: var(--radius-lg);
      }
      .modal-header {
        padding: 1rem 1.15rem;
      }
      .modal-body {
        padding: 1.15rem 1rem;
      }
      .modal-footer {
        padding: 0.85rem 1rem;
        flex-direction: column-reverse;
        gap: 0.5rem;
      }
      .modal-footer .btn {
        width: 100%;
      }
    }

    .form-row-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    @media (max-width: 540px) {
      .form-row-2col {
        grid-template-columns: 1fr !important;
        gap: 0.5rem !important;
      }
    }

    /* Toast */
    #toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 2000;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      min-width: 280px;
      max-width: 400px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.85rem 1.1rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      animation: slideIn 0.25s ease forwards;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Timeline */
    .timeline-item {
      position: relative;
      padding-left: 2rem;
      padding-bottom: 1.5rem;
    }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 14px;
      bottom: 0;
      width: 2px;
      background: var(--border-color);
    }
    .timeline-item:last-child::before { display: none; }
    .timeline-dot {
      position: absolute;
      left: 0;
      top: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--bg-surface);
      border: 2px solid var(--border-color);
    }
    .timeline-item.completed .timeline-dot {
      border-color: var(--success);
      background: var(--success);
    }
    .timeline-item.active .timeline-dot {
      border-color: var(--primary);
      background: var(--bg-surface);
      box-shadow: 0 0 0 3px var(--primary-subtle);
    }

    /* Tabs / Segmented controls */
    .tab-btn {
      padding: 0.45rem 0.95rem;
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: var(--radius-md);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn:hover { color: var(--text-main); }
    .tab-btn.active {
      color: var(--text-main);
      background: var(--bg-surface);
      box-shadow: var(--shadow-sm);
    }

    /* Navigation Bar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(248, 250, 252, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      transition: background-color 0.2s ease;
      width: 100%;
      max-width: 100%;
    }
    html.dark .navbar {
      background: rgba(11, 17, 32, 0.95);
    }
    .desktop-nav-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }
    .desktop-right-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .mobile-header-actions {
      display: none;
      align-items: center;
      gap: 0.4rem;
    }
    @media (max-width: 1023px) {
      .desktop-nav-links {
        display: none !important;
      }
      .desktop-right-actions {
        display: none !important;
      }
      .mobile-header-actions {
        display: flex !important;
      }
    }
    @media (max-width: 380px) {
      .brand-subtext {
        display: none !important;
      }
      .mobile-report-text {
        display: none !important;
      }
      .mobile-quick-report-btn {
        padding: 0.4rem 0.5rem !important;
      }
    }

    /* Mobile Drawer */
    .mobile-nav-drawer {
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      padding: 1.15rem 1rem;
      box-shadow: var(--shadow-lg);
      max-height: calc(100vh - 65px);
      overflow-y: auto;
      animation: mobileNavSlideDown 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes mobileNavSlideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .mobile-nav-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      text-decoration: none;
      border-bottom: 1px solid var(--border-color);
      transition: color 0.15s ease;
    }
    .mobile-nav-link:last-child {
      border-bottom: none;
    }
    .mobile-nav-link:hover {
      color: var(--primary);
    }

    /* Notification Tray Popover (Desktop & Mobile) */
    .notif-tray-popover {
      display: none;
      position: absolute;
      right: 1.5rem;
      top: 64px;
      width: 380px;
      max-width: calc(100vw - 2rem);
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      z-index: 1100;
      overflow: hidden;
    }
    @media (max-width: 640px) {
      .notif-tray-popover {
        right: 0.5rem !important;
        left: 0.5rem !important;
        width: auto !important;
        max-width: calc(100vw - 1rem) !important;
        top: 60px !important;
      }
    }

    /* Table styles */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .data-table th {
      text-align: left;
      padding: 0.75rem 1rem;
      background: var(--bg-surface-subtle);
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }
    .data-table td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
      vertical-align: middle;
    }
    .data-table tr:hover td {
      background: var(--bg-surface-subtle);
    }

    /* Responsive Grid & Hero Styles */
    .hero-section {
      padding: 4.5rem 0 3.5rem 0;
      background: radial-gradient(circle at 10% 20%, rgba(37,99,235,0.06) 0%, transparent 60%);
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }
    @media (max-width: 960px) {
      .hero-section {
        padding: 3rem 0 2.25rem 0;
      }
    }
    @media (max-width: 640px) {
      .hero-section {
        padding: 2rem 0 1.5rem 0;
      }
    }

    .grid-hero {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 3rem;
      align-items: center;
      width: 100%;
      max-width: 100%;
    }
    @media (max-width: 960px) {
      .grid-hero { grid-template-columns: 1fr; gap: 2rem; }
    }
    @media (max-width: 480px) {
      .grid-hero { gap: 1.5rem; }
    }

    .hero-cta-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      margin-bottom: 2.25rem;
      width: 100%;
    }
    @media (max-width: 640px) {
      .hero-cta-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.65rem;
        margin-bottom: 1.75rem;
      }
      .hero-cta-group .btn {
        width: 100%;
        padding: 0.65rem 0.75rem !important;
        font-size: 0.85rem !important;
        justify-content: center;
      }
    }
    @media (max-width: 420px) {
      .hero-cta-group {
        grid-template-columns: 1fr;
        gap: 0.6rem;
      }
    }

    .hero-dispatch-card {
      padding: 1.5rem;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      border-color: var(--border-color);
      position: relative;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }
    @media (max-width: 640px) {
      .hero-dispatch-card {
        padding: 1rem;
        border-radius: var(--radius-lg);
      }
    }
    @media (max-width: 360px) {
      .hero-dispatch-card {
        padding: 0.85rem;
      }
    }

    .mockup-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      width: 100%;
    }
    @media (max-width: 480px) {
      .mockup-stats-grid {
        gap: 0.4rem;
        margin-bottom: 1rem;
      }
      .mockup-stat-box {
        padding: 0.5rem 0.25rem !important;
      }
      .mockup-stat-val {
        font-size: 1.15rem !important;
      }
      .mockup-stat-lbl {
        font-size: 0.62rem !important;
      }
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: center;
      width: 100%;
      max-width: 100%;
    }
    @media (max-width: 860px) {
      .about-grid {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
    }

    .cta-banner {
      background: linear-gradient(135deg, var(--primary) 0%, #071f4a 100%);
      color: #fff;
      padding: 3.5rem 2rem;
      border-radius: var(--radius-xl);
      text-align: center;
      box-shadow: var(--shadow-lg);
      width: 100%;
      box-sizing: border-box;
    }
    @media (max-width: 640px) {
      .cta-banner {
        padding: 2.25rem 1.25rem;
        border-radius: var(--radius-lg);
      }
      .cta-banner-buttons {
        flex-direction: column !important;
        gap: 0.75rem !important;
      }
      .cta-banner-buttons .btn {
        width: 100% !important;
      }
    }

    .admin-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: calc(100vh - 65px);
      width: 100%;
      max-width: 100%;
    }
    @media (max-width: 860px) {
      .admin-layout { grid-template-columns: 1fr; }
      .admin-sidebar { display: none; }
      .admin-sidebar.mobile-open {
        display: flex !important;
        position: fixed;
        inset: 0;
        z-index: 1200;
        width: 290px;
        max-width: 85vw;
        box-shadow: var(--shadow-lg);
      }
      .admin-sidebar-backdrop {
        display: block !important;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.6);
        z-index: 1199;
      }
    }

    /* Technician Calendar Schedule Styles */
    .schedule-calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: var(--border-color);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .calendar-header-cell {
      background: var(--bg-surface-subtle);
      padding: 0.65rem 0.5rem;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .calendar-day-cell {
      background: var(--bg-surface);
      min-height: 110px;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      transition: background-color 0.15s ease;
      cursor: pointer;
    }
    .calendar-day-cell:hover {
      background: var(--bg-surface-subtle);
    }
    .calendar-day-cell.other-month {
      background: var(--bg-page);
      opacity: 0.5;
    }
    .calendar-day-cell.is-today {
      background: rgba(59, 130, 246, 0.05);
      outline: 2px solid var(--primary);
    }
    .calendar-day-cell.is-selected {
      outline: 2px solid var(--accent);
      z-index: 2;
    }
    .cal-day-num {
      font-size: 0.8rem;
      font-weight: 700;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .cal-task-pill {
      font-size: 0.72rem;
      padding: 0.2rem 0.4rem;
      border-radius: var(--radius-sm);
      background: var(--bg-surface-subtle);
      border-left: 3px solid var(--primary);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.25rem;

      font-weight: 900;
      padding: 0.15rem 0.45rem;
      border-radius: 9999px;
      letter-spacing: 0.04em;

      position: fixed;
      bottom: 84px;
      right: 24px;
      z-index: 9999;
      width: 400px;
      max-width: calc(100vw - 32px);
      height: 560px;
      max-height: calc(100vh - 110px);
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      box-shadow: 0 20px 45px -8px rgba(9, 37, 86, 0.25), 0 8px 16px -4px rgba(9, 37, 86, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: chatbotFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes chatbotFadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .chatbot-header {
      background: linear-gradient(135deg, #092556 0%, #1e3a8a 100%);
      color: #ffffff;
      padding: 1rem 1.15rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .chatbot-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.15rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      background: var(--bg-page);
    }
    .chat-bubble-user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--primary) 0%, #1e40af 100%);
      color: #ffffff;
      border-radius: 16px 16px 2px 16px;
      padding: 0.75rem 1rem;
      max-width: 84%;
      font-size: 0.875rem;
      line-height: 1.45;
      box-shadow: var(--shadow-sm);
      word-break: break-word;
    }
    .chat-bubble-model {
      align-self: flex-start;
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 16px 16px 16px 2px;
      padding: 0.85rem 1rem;
      max-width: 88%;
      font-size: 0.875rem;
      line-height: 1.5;
      box-shadow: var(--shadow-sm);
      word-break: break-word;
    }
    .chat-typing-dots {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      padding: 4px 6px;
    }
    .chat-typing-dots span {
      width: 6px;
      height: 6px;
      background: var(--primary);
      border-radius: 50%;
      animation: chatBounce 1.4s infinite ease-in-out both;
    }
    .chat-typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .chat-typing-dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes chatBounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    .chat-chip {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--primary);
      padding: 0.35rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .chat-chip:hover {
      background: var(--primary-subtle);
      border-color: var(--primary);
    }

      .chatbot-window {
        bottom: 0 !important;
        right: 0 !important;
        left: 0 !important;

      }
      .chatbot-trigger-btn {
        bottom: 16px;
        right: 16px;
        padding: 0.65rem 1rem;

    function getDB() {
      try {
        const raw = localStorage.getItem(APP_STORAGE_KEY);
        if (!raw) {
          localStorage.setItem(APP_STORAGE_KEY, JSON.stringify(defaultData));
          return JSON.parse(JSON.stringify(defaultData));
        }
        const parsed = JSON.parse(raw);
        // Ensure authentic GNIOT real data and authorized admins are active
        if (!parsed.settings || parsed.settings.erpHead !== defaultData.settings.erpHead || !parsed.admins || !parsed.admins.some(a => a.email === 'ayushjaiswal272008@gmail.com')) {
          parsed.admins = defaultData.admins;
          parsed.settings = { ...parsed.settings, ...defaultData.settings };
          localStorage.setItem(APP_STORAGE_KEY, JSON.stringify(parsed));
          return parsed;
        }
        return parsed;
      } catch (e) {
        console.error('Storage error, resetting to default', e);
        return JSON.parse(JSON.stringify(defaultData));
      }
    }

      } catch (e) {
        console.error('Failed to save to localStorage', e);
      }
    }

    // Session helpers
    function getSession() {
      try {
        const raw = localStorage.getItem(SESSION_STORAGE_KEY) || sessionStorage.getItem(SESSION_STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function setSession(role, user) {
      localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({ role, user }));
      try { sessionStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) {}
      updateNavSession();
    }

    function clearSession() {
      const token = localStorage.getItem('campusfix_admin_token') || sessionStorage.getItem('campusfix_admin_token');
      if (token) {
        fetch('/api/admin/logout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        }).catch(() => {});
        localStorage.removeItem('campusfix_admin_token');
        try { sessionStorage.removeItem('campusfix_admin_token'); } catch (e) {}
      }
      localStorage.removeItem(SESSION_STORAGE_KEY);
      try { sessionStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) {}
      showToast('Logged out', 'You have been successfully signed out.', 'info');
      setView('landing');
      updateNavSession();
    }

    // Theme Management
    function initTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem(THEME_STORAGE_KEY, isDark ? 'dark' : 'light');
      updateThemeIcon();
    }

    function updateThemeIcon() {
      const isDark = document.documentElement.classList.contains('dark');
      const icon = isDark ? iconSvg('sun', 17) : iconSvg('moon', 17);
      const label = isDark ? 'Switch to light mode' : 'Switch to dark mode';
      const btn = document.getElementById('theme-toggle-btn');
      if (btn) {
        btn.innerHTML = icon;
        btn.setAttribute('aria-label', label);
      }
      const mobBtn = document.getElementById('mobile-theme-toggle-btn');
      if (mobBtn) {
        mobBtn.innerHTML = icon;
        mobBtn.setAttribute('aria-label', label);
      }
    }

    // Web Audio Chime for Real-Time Push Notification
    function playNotificationChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
        osc.frequency.exponentialRampToValueAtTime(880.00, ctx.currentTime + 0.15); // A5
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) {
        // Audio policy or silent mode
      }
    }

    // Real-Time Push Notification System
    function pushRealTimeNotification({ title, message, targetRole, targetUser, ticketId, type = 'info' }) {
      const db = getDB();
      const newNotif = {
        id: 'notif-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
        title,
        message,
        targetRole: targetRole || 'all',
        targetUser: targetUser || null,
        ticketId: ticketId || null,
        type,
        time: 'Just now',
        timestamp: Date.now(),
        read: false
      };
      
      db.notifications.unshift(newNotif);
      saveDB(db);

      // Play soft chime
      playNotificationChime();

      // Show real-time push toast alert immediately
      showPushAlertToast(newNotif);

      // Update badge in top navigation
      updateNotificationBadge();
      renderNotificationsList();
    }

      el.style.borderLeft = `4px solid ${borderColor}`;
      
      const iconName = notif.type === 'success' ? 'check-circle' : notif.type === 'urgent' ? 'alert-triangle' : 'bell';

      const roleColor = notif.targetRole === 'student' ? 'var(--primary)' : notif.targetRole === 'staff' ? 'var(--accent)' : notif.targetRole === 'admin' ? '#9333ea' : 'var(--text-subtle)';

        <div style="color:${borderColor};margin-top:2px;">${iconSvg(iconName, 20)}</div>

      const container = document.getElementById('toast-container');

      const el = document.createElement('div');
      el.className = 'toast';
      const icon = type === 'success' ? 'check-circle' : type === 'danger' ? 'alert-triangle' : 'info';

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    // Active View state
    let currentView = 'landing';
    let currentFilter = { status: 'all', category: 'all', priority: 'all', search: '' };
    let selectedTicket = null;

    // Staff Schedule Calendar State
    let staffViewMode = 'schedule'; // 'schedule' (Calendar) | 'list'
    let scheduleCalYear = 2026;
    let scheduleCalMonth = 9; // October (0-indexed: 9 = Oct)
    let selectedScheduleDate = '2026-10-06';

    function getTicketScheduleDate(t) {
      if (t.scheduledDate) return t.scheduledDate;
      // Derive from createdAt string (e.g. "2026-10-04 10:15 AM" or "Oct 04, 10:15 AM")
      if (t.createdAt && t.createdAt.startsWith('2026-')) {
        return t.createdAt.split(' ')[0];
      } else if (t.createdAt && t.createdAt.includes('Oct 04')) {
        return '2026-10-04';
      } else if (t.createdAt && t.createdAt.includes('Oct 05')) {
        return '2026-10-05';
      } else if (t.createdAt && t.createdAt.includes('Oct 02')) {
        return '2026-10-02';
      }
      return '2026-10-06';
    }

    function changeCalendarMonth(delta) {
      scheduleCalMonth += delta;
      if (scheduleCalMonth < 0) {
        scheduleCalMonth = 11;
        scheduleCalYear -= 1;
      } else if (scheduleCalMonth > 11) {
        scheduleCalMonth = 0;
        scheduleCalYear += 1;
      }
      renderApp();
    }

    function selectScheduleDate(dateStr) {
      selectedScheduleDate = dateStr;
      renderApp();
    }

    function setTaskScheduleDate(ticketId, newDate, newSlot) {
      const db = getDB();
      const ticket = db.complaints.find(c => c.id === ticketId);
      if (ticket) {
        ticket.scheduledDate = newDate;
        ticket.scheduledSlot = newSlot || 'Morning Slot (10:00 AM)';
        ticket.updatedAt = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        ticket.timeline.push({
          stage: 'Rescheduled',
          time: ticket.updatedAt,
          note: `Technician scheduled target service for ${newDate} (${ticket.scheduledSlot})`
        });
        saveDB(db);

        // REAL-TIME PUSH NOTIFICATIONS TO ALL 3 PARTIES
        // 1. Student
        pushRealTimeNotification({
          title: `Service Scheduled: ${ticketId}`,
          message: `Technician ${ticket.assignedStaff} scheduled work for ${newDate} [${ticket.scheduledSlot}].`,
          ticketId,
          targetRole: 'student',
          targetUser: ticket.email,
          type: 'info'
        });

        // 2. Staff
        pushRealTimeNotification({
          title: `Task Scheduled: ${ticketId}`,
          message: `You scheduled service for ${ticketId} on ${newDate} [${ticket.scheduledSlot}].`,
          ticketId,
          targetRole: 'staff',
          targetUser: ticket.assignedStaff,
          type: 'info'
        });

        // 3. Admin
        pushRealTimeNotification({
          title: `Service Scheduled: ${ticketId}`,
          message: `Technician ${ticket.assignedStaff} scheduled work order ${ticketId} for ${newDate} [${ticket.scheduledSlot}].`,
          ticketId,
          targetRole: 'admin',
          type: 'info'
        });

        showToast('Schedule Updated', `Ticket ${ticketId} scheduled for ${newDate}`, 'success');
        renderApp();
      }
    }

      const session = getSession();
      const db = getDB();
      const currentStaff = session && session.role === 'staff' ? session.user : db.staff[0]; // fallback Rajesh Sharma
      
      const assignedTickets = db.complaints.filter(c => c.assignedStaff === currentStaff.name);
      const pendingTasks = assignedTickets.filter(c => c.status === 'Assigned' || c.status === 'Pending').length;
      const inProgressTasks = assignedTickets.filter(c => c.status === 'In Progress').length;
      const completedTasks = assignedTickets.filter(c => c.status === 'Resolved').length;

      return `
        <div class="container-custom" style="padding: 2.5rem 1.5rem;">
          <!-- Staff Top Bar -->
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;">
            <div>
              <div style="font-size:0.8rem;color:var(--text-muted);font-weight:600;margin-bottom:0.25rem;">MAINTENANCE STAFF CONSOLE &middot; ID: ${escapeHtml(currentStaff.id)}</div>
              <h1 style="font-size:2rem;font-weight:800;letter-spacing:-0.03em;">Staff Portal: ${escapeHtml(currentStaff.name)}</h1>
              <p style="font-size:0.875rem;color:var(--text-muted);">Specialization: <strong>${escapeHtml(currentStaff.dept)} (${escapeHtml(currentStaff.spec)})</strong> &middot; Status: <span style="color:var(--success);font-weight:600;">Active Duty</span></p>
            </div>
            
            <div style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap;">
              <!-- View Mode Segmented Switcher -->
              <div style="display:flex;background:var(--bg-surface-subtle);padding:0.25rem;border-radius:var(--radius-md);border:1px solid var(--border-color);">
                <button onclick="staffViewMode='schedule';renderApp();" class="tab-btn ${staffViewMode==='schedule'?'active':''}" style="display:flex;align-items:center;gap:0.35rem;">
                  ${iconSvg('calendar', 15)} <span>Technician Schedule</span>
                </button>
                <button onclick="staffViewMode='list';renderApp();" class="tab-btn ${staffViewMode==='list'?'active':''}" style="display:flex;align-items:center;gap:0.35rem;">
                  ${iconSvg('tool', 15)} <span>Task List (${assignedTickets.length})</span>
                </button>
              </div>

              <button onclick="openStaffSwitchModal()" class="btn btn-secondary btn-sm">Switch Technician</button>
              <button onclick="openModal('track-modal')" class="btn btn-secondary btn-sm">Lookup Ticket</button>
            </div>
          </div>

          <!-- Staff KPI Metric Cards -->
          <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:1rem;margin-bottom:2.25rem;">
            <div class="card" style="padding:1.25rem;">
              <div style="font-size:0.8rem;color:var(--text-muted);font-weight:600;">Assigned To Me</div>
              <div style="font-size:2rem;font-weight:800;font-family:var(--font-mono);color:var(--text-main);margin-top:0.35rem;">${assignedTickets.length}</div>
              <div style="font-size:0.75rem;color:var(--text-subtle);margin-top:0.25rem;">Total workload</div>
            </div>
            <div class="card" style="padding:1.25rem;">
              <div style="font-size:0.8rem;color:var(--warning);font-weight:600;">Awaiting My Action</div>
              <div style="font-size:2rem;font-weight:800;font-family:var(--font-mono);color:var(--warning);margin-top:0.35rem;">${pendingTasks}</div>
              <div style="font-size:0.75rem;color:var(--text-subtle);margin-top:0.25rem;">Needs acceptance/inspection</div>
            </div>
            <div class="card" style="padding:1.25rem;">
              <div style="font-size:0.8rem;color:#0284c7;font-weight:600;">Under Repair</div>
              <div style="font-size:2rem;font-weight:800;font-family:var(--font-mono);color:#0284c7;margin-top:0.35rem;">${inProgressTasks}</div>
              <div style="font-size:0.75rem;color:var(--text-subtle);margin-top:0.25rem;">Parts/service ongoing</div>
            </div>
            <div class="card" style="padding:1.25rem;">
              <div style="font-size:0.8rem;color:var(--success);font-weight:600;">Resolved By Me</div>
              <div style="font-size:2rem;font-weight:800;font-family:var(--font-mono);color:var(--success);margin-top:0.35rem;">${completedTasks}</div>
              <div style="font-size:0.75rem;color:var(--text-subtle);margin-top:0.25rem;">Successfully closed</div>
            </div>
          </div>

          <!-- Main View Content (Schedule Calendar OR List View) -->
          ${staffViewMode === 'schedule'
            ? renderTechnicianScheduleView(assignedTickets, currentStaff)
            : renderStaffListView(assignedTickets, currentStaff)}
        </div>
      `;
    }

    // Technician Schedule Calendar View Renderer
    function renderTechnicianScheduleView(assignedTickets, currentStaff) {
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      const monthName = monthNames[scheduleCalMonth];

      // Calendar dates calculation
      const firstDayOfMonth = new Date(scheduleCalYear, scheduleCalMonth, 1).getDay(); // 0 is Sunday
      const daysInMonth = new Date(scheduleCalYear, scheduleCalMonth + 1, 0).getDate();
      const prevMonthDays = new Date(scheduleCalYear, scheduleCalMonth, 0).getDate();

      // Today date string for reference
      const todayStr = '2026-10-06';

      // Find tickets for the selected day
      const selectedDayTickets = assignedTickets.filter(t => getTicketScheduleDate(t) === selectedScheduleDate);

      // Total scheduled in this month
      const monthPrefix = `${scheduleCalYear}-${String(scheduleCalMonth + 1).padStart(2, '0')}`;
      const monthTicketsCount = assignedTickets.filter(t => getTicketScheduleDate(t).startsWith(monthPrefix)).length;

      let calendarCellsHtml = '';

      // Leading padding cells from previous month
      for (let i = 0; i < firstDayOfMonth; i++) {
        const dayNum = prevMonthDays - firstDayOfMonth + 1 + i;
        calendarCellsHtml += `
          <div class="calendar-day-cell other-month">
            <div class="cal-day-num" style="color:var(--text-subtle);">${dayNum}</div>
          </div>
        `;
      }

      // Days in current month
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${scheduleCalYear}-${String(scheduleCalMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayTickets = assignedTickets.filter(t => getTicketScheduleDate(t) === dateStr);
        const isToday = dateStr === todayStr;
        const isSelected = dateStr === selectedScheduleDate;

        calendarCellsHtml += `
          <div class="calendar-day-cell ${isToday ? 'is-today' : ''} ${isSelected ? 'is-selected' : ''}" onclick="selectScheduleDate('${dateStr}')">
            <div class="cal-day-num">
              <span style="${isToday ? 'color:var(--primary);font-weight:800;' : ''}">${day}</span>
              ${isToday ? `<span style="font-size:0.6rem;background:var(--primary);color:#fff;padding:1px 4px;border-radius:4px;">TODAY</span>` : ''}
              ${dayTickets.length > 0 ? `<span style="font-size:0.68rem;background:var(--primary-subtle);color:var(--primary);padding:1px 5px;border-radius:10px;font-weight:700;">${dayTickets.length}</span>` : ''}
            </div>

            <!-- Task Pills inside day cell -->
            <div style="display:flex;flex-direction:column;gap:0.25rem;overflow:hidden;margin-top:0.2rem;">
              ${dayTickets.map(t => {
                const borderCol = t.status === 'Resolved' ? 'var(--success)' : t.priority === 'Urgent' ? 'var(--danger)' : t.priority === 'High' ? 'var(--warning)' : 'var(--primary)';
                return `
                  <div class="cal-task-pill" style="border-left-color:${borderCol};" title="${escapeHtml(t.id)}: ${escapeHtml(t.category)} (${escapeHtml(t.building)})" onclick="event.stopPropagation();selectScheduleDate('${dateStr}');showTrackModalWithTicket('${t.id}')">
                    <span style="font-family:var(--font-mono);font-weight:700;">${escapeHtml(t.id)}</span>
                    <span style="font-size:0.65rem;color:var(--text-subtle);">${escapeHtml(t.status)}</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      // Trailing padding cells to complete 7-column grid
      const totalCells = firstDayOfMonth + daysInMonth;
      const remainingCells = (7 - (totalCells % 7)) % 7;
      for (let i = 1; i <= remainingCells; i++) {
        calendarCellsHtml += `
          <div class="calendar-day-cell other-month">
            <div class="cal-day-num" style="color:var(--text-subtle);">${i}</div>
          </div>
        `;
      }

      return `
        <div>
          <!-- Calendar Controls Bar -->
          <div class="card" style="padding:1.25rem 1.5rem;margin-bottom:1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;">
            <div style="display:flex;align-items:center;gap:1rem;">
              <div style="font-size:1.35rem;font-weight:800;letter-spacing:-0.02em;display:flex;align-items:center;gap:0.5rem;">
                ${iconSvg('calendar', 22)} <span>${monthName} ${scheduleCalYear}</span>
              </div>
              <span class="status-badge" style="background:var(--primary-subtle);color:var(--primary);">
                ${monthTicketsCount} Tasks Scheduled This Month
              </span>
            </div>

            <div style="display:flex;align-items:center;gap:0.5rem;">
              <button onclick="changeCalendarMonth(-1)" class="btn btn-secondary btn-sm" title="Previous Month">&larr; Prev</button>
              <button onclick="scheduleCalYear=2026;scheduleCalMonth=9;selectScheduleDate('2026-10-06');" class="btn btn-secondary btn-sm">
                Today (Oct 06)
              </button>
              <button onclick="changeCalendarMonth(1)" class="btn btn-secondary btn-sm" title="Next Month">Next &rarr;</button>
            </div>
          </div>

          <!-- Calendar Grid Section -->
          <div class="card" style="padding:0;overflow:hidden;margin-bottom:2rem;">
            <div class="schedule-calendar-grid">
              <div class="calendar-header-cell">Sun</div>
              <div class="calendar-header-cell">Mon</div>
              <div class="calendar-header-cell">Tue</div>
              <div class="calendar-header-cell">Wed</div>
              <div class="calendar-header-cell">Thu</div>
              <div class="calendar-header-cell">Fri</div>
              <div class="calendar-header-cell">Sat</div>
              ${calendarCellsHtml}
            </div>
          </div>

          <!-- Selected Day Detailed Itinerary & Dispatch Panel -->
          <div class="card" style="padding:1.5rem;border-radius:var(--radius-xl);">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid var(--border-color);flex-wrap:wrap;gap:1rem;">
              <div>
                <div style="font-size:0.75rem;font-weight:700;color:var(--primary);letter-spacing:0.04em;text-transform:uppercase;">Daily Workload Itinerary</div>
                <h3 style="font-size:1.3rem;font-weight:800;color:var(--text-main);margin-top:0.2rem;">
                  Schedule for: ${selectedScheduleDate} ${selectedScheduleDate === todayStr ? '(TODAY)' : ''}
                </h3>
                <div style="font-size:0.825rem;color:var(--text-muted);margin-top:0.25rem;">
                  ${selectedDayTickets.length} work order(s) scheduled on this day
                </div>
              </div>

              <!-- Quick Action: Schedule an existing ticket to this day -->
              <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
                <label style="font-size:0.8rem;font-weight:600;color:var(--text-muted);">Schedule Ticket to this Day:</label>
                <select id="quick-reschedule-select" class="form-select" style="width:auto;padding:0.35rem 0.65rem;font-size:0.8rem;" onchange="if(this.value){setTaskScheduleDate(this.value, '${selectedScheduleDate}', 'Scheduled Inspection');this.value='';}">
                  <option value="">-- Choose Ticket --</option>
                  ${assignedTickets.map(t => `<option value="${escapeHtml(t.id)}">${escapeHtml(t.id)} - ${escapeHtml(t.category)} (${escapeHtml(t.status)})</option>`).join('')}
                </select>
              </div>
            </div>

            ${selectedDayTickets.length === 0 ? `
              <div style="padding:2.5rem 1rem;text-align:center;color:var(--text-muted);">
                ${iconSvg('calendar', 32)}
                <div style="font-weight:700;font-size:1rem;margin-top:0.75rem;">No tasks scheduled for ${selectedScheduleDate}</div>
                <div style="font-size:0.825rem;margin-top:0.25rem;">Select another day from the calendar above, or assign an ongoing ticket to this day using the dropdown above.</div>
              </div>
            ` : `
              <div style="display:flex;flex-direction:column;gap:1rem;">
                ${selectedDayTickets.map((t, idx) => {
                  const slotName = t.scheduledSlot || (idx === 0 ? 'Morning Slot (10:00 AM)' : idx === 1 ? 'Afternoon Slot (02:30 PM)' : 'Evening Inspection');
                  return `
                    <div style="background:var(--bg-page);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:1.25rem;display:flex;flex-direction:column;gap:0.75rem;">
                      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:0.75rem;">
                        <div>
                          <div style="display:flex;align-items:center;gap:0.6rem;margin-bottom:0.3rem;">
                            <span style="font-family:var(--font-mono);font-weight:800;font-size:1rem;color:var(--primary);">${escapeHtml(t.id)}</span>
                            <span class="status-badge status-${t.status.toLowerCase().replace(/\s+/g, '-')}">${escapeHtml(t.status)}</span>
                            <span class="priority-${t.priority.toLowerCase()}">Priority: ${escapeHtml(t.priority)}</span>
                            <span style="font-size:0.75rem;background:var(--primary-subtle);color:var(--primary);padding:0.15rem 0.5rem;border-radius:4px;font-weight:600;">
                              ${escapeHtml(slotName)}
                            </span>
                          </div>
                          <h4 style="font-size:1.05rem;font-weight:700;color:var(--text-main);">${escapeHtml(t.category)}: ${escapeHtml(t.subCategory || 'General Issue')}</h4>
                          <div style="font-size:0.8rem;color:var(--text-muted);margin-top:0.2rem;">
                            Location: <strong>${escapeHtml(t.building)}, ${escapeHtml(t.room)}</strong> &middot; 
                            Student: ${escapeHtml(t.studentName)} (${escapeHtml(t.contact)})
                          </div>
                        </div>

                        <!-- Card Action buttons -->
                        <div style="display:flex;gap:0.4rem;align-items:center;flex-wrap:wrap;">
                          ${t.status !== 'In Progress' && t.status !== 'Resolved' ? `
                            <button onclick="updateTicketStatusFromStaff('${t.id}', 'In Progress')" class="btn btn-primary btn-sm">
                              Start Work
                            </button>
                          ` : ''}

                          ${t.status !== 'Resolved' ? `
                            <button onclick="openResolveModalForStaff('${t.id}')" class="btn btn-secondary btn-sm" style="border-color:var(--success);color:var(--success);font-weight:700;">
                              ${iconSvg('check', 14)} Resolve
                            </button>
                          ` : `
                            <span style="color:var(--success);font-weight:700;font-size:0.8rem;display:flex;align-items:center;gap:0.25rem;">
                              ${iconSvg('check-circle', 14)} Resolved
                            </span>
                          `}

                          <button onclick="showTrackModalWithTicket('${t.id}')" class="btn btn-secondary btn-sm">
                            Inspect
                          </button>
                        </div>
                      </div>

                      <div style="font-size:0.825rem;color:var(--text-muted);line-height:1.45;background:var(--bg-surface);padding:0.75rem;border-radius:var(--radius-md);border:1px solid var(--border-color);">
                        <strong>Description:</strong> ${escapeHtml(t.description)}
                        ${t.staffNotes ? `<div style="margin-top:0.4rem;color:var(--primary);"><strong>Technician Note:</strong> ${escapeHtml(t.staffNotes)}</div>` : ''}
                      </div>

                      <!-- Reschedule row -->
                      <div style="display:flex;align-items:center;justify-content:space-between;padding-top:0.5rem;border-top:1px dashed var(--border-color);font-size:0.75rem;color:var(--text-muted);flex-wrap:wrap;gap:0.5rem;">
                        <span>Target Service: <strong>${selectedScheduleDate} (${escapeHtml(slotName)})</strong></span>
                        <div style="display:flex;align-items:center;gap:0.4rem;">
                          <span>Change Slot:</span>
                          <select onchange="setTaskScheduleDate('${t.id}', '${selectedScheduleDate}', this.value)" style="font-size:0.75rem;padding:0.2rem 0.4rem;border-radius:4px;border:1px solid var(--border-color);background:var(--bg-surface);color:inherit;">
                            <option value="Morning Slot (10:00 AM)" ${slotName.includes('Morning')?'selected':''}>Morning (10:00 AM)</option>
                            <option value="Afternoon Slot (02:30 PM)" ${slotName.includes('Afternoon')?'selected':''}>Afternoon (02:30 PM)</option>
                            <option value="Evening Slot (05:00 PM)" ${slotName.includes('Evening')?'selected':''}>Evening (05:00 PM)</option>
                          </select>
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    // Staff List View (Standard tabular / card list view)
    function renderStaffListView(assignedTickets, currentStaff) {
      return `
        <div class="card" style="padding:0;overflow:hidden;">
          <div style="padding:1.25rem 1.5rem;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;">
            <div>
              <h3 style="font-size:1.1rem;font-weight:800;">My Assigned Work Orders</h3>
              <div style="font-size:0.785rem;color:var(--text-muted);">Manage status, perform inspections, and submit completion notes</div>
            </div>
          </div>

          ${assignedTickets.length === 0 ? `
            <div style="padding:3.5rem 1.5rem;text-align:center;color:var(--text-muted);">
              ${iconSvg('check-circle', 36)}
              <div style="font-weight:700;font-size:1.1rem;margin-top:0.75rem;">No tickets assigned to ${escapeHtml(currentStaff.name)}</div>
              <div style="font-size:0.85rem;margin-top:0.25rem;">All caught up! New campus tickets assigned to you will appear here in real-time.</div>

            <div style="display:flex;flex-direction:column;divide-y:1px solid var(--border-color);">
              ${assignedTickets.map(c => `
                <div style="padding:1.25rem 1.5rem;border-bottom:1px solid var(--border-color);display:flex;flex-direction:column;gap:1rem;">
                  <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:0.75rem;">
                    <div>
                      <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.25rem;">
                        <span style="font-family:var(--font-mono);font-size:0.95rem;font-weight:800;color:var(--primary);">${escapeHtml(c.id)}</span>
                        <span class="status-badge status-${c.status.toLowerCase().replace(/\s+/g, '-')}">${escapeHtml(c.status)}</span>
                        <span class="priority-${c.priority.toLowerCase()}">Priority: ${escapeHtml(c.priority)}</span>
                      </div>
                      <h4 style="font-size:1.05rem;font-weight:700;color:var(--text-main);">${escapeHtml(c.category)}: ${escapeHtml(c.subCategory || 'Issue')}</h4>
                      <div style="font-size:0.825rem;color:var(--text-muted);margin-top:0.2rem;">

                        <strong>Student:</strong> ${escapeHtml(c.studentName)} (${escapeHtml(c.contact)}) &middot;
                        <strong>Reported:</strong> ${escapeHtml(c.createdAt)} &middot;
                        <strong>Scheduled:</strong> <span style="color:var(--primary);font-weight:600;">${getTicketScheduleDate(c)}</span>

                      ${c.status !== 'In Progress' && c.status !== 'Resolved' ? `
                        <button onclick="updateTicketStatusFromStaff('${c.id}', 'In Progress')" class="btn btn-primary btn-sm">
                          Accept &amp; Start Work
                        </button>
                      ` : ''}

                      ${c.status !== 'Resolved' ? `
                        <button onclick="openResolveModalForStaff('${c.id}')" class="btn btn-secondary btn-sm" style="border-color:var(--success);color:var(--success);font-weight:700;">
                          ${iconSvg('check', 14)} Mark Resolved
                        </button>
                      ` : `
                        <span style="color:var(--success);font-weight:700;font-size:0.8rem;display:flex;align-items:center;gap:0.3rem;">
                          ${iconSvg('check-circle', 14)} Closed &amp; Verified
                        </span>
                      `}

                      <button onclick="showTrackModalWithTicket('${c.id}')" class="btn btn-secondary btn-sm">
                        Timeline
                      </button>
                    </div>
                  </div>

                  <!-- Description and Notes -->
                  <div style="background:var(--bg-surface-subtle);padding:0.85rem 1rem;border-radius:var(--radius-md);font-size:0.85rem;">
                    <div style="color:var(--text-main);font-weight:500;margin-bottom:0.25rem;">Description:</div>
                    <div style="color:var(--text-muted);">${escapeHtml(c.description)}</div>
                    ${c.staffNotes ? `
                      <div style="margin-top:0.6rem;padding-top:0.6rem;border-top:1px dashed var(--border-color);color:var(--primary);font-size:0.8rem;">

                      </div>
                    ` : ''}

                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;

    // Admin Dashboard state
    let adminActiveTab = 'dashboard';

    function setAdminTab(tab) {
      adminActiveTab = tab;
      closeAdminSidebar();
      renderApp();
    }

    function toggleAdminSidebar() {
      const sb = document.querySelector('.admin-sidebar');
      const bd = document.getElementById('admin-sidebar-backdrop');
      if (sb) {
        const isOpen = sb.classList.contains('mobile-open');
        if (isOpen) {
          sb.classList.remove('mobile-open');
          if (bd) bd.style.display = 'none';
        } else {
          sb.classList.add('mobile-open');
          if (bd) bd.style.display = 'block';
        }
      }
    }

    function closeAdminSidebar() {
      const sb = document.querySelector('.admin-sidebar');
      const bd = document.getElementById('admin-sidebar-backdrop');
      if (sb) sb.classList.remove('mobile-open');
      if (bd) bd.style.display = 'none';
    }

    // Admin Dashboard Renderer
    function renderAdminDashboardView() {
      const db = getDB();
      const complaints = db.complaints;
      const total = complaints.length;
      const pending = complaints.filter(c => c.status === 'Pending').length;
      const assigned = complaints.filter(c => c.status === 'Assigned').length;
      const inProgress = complaints.filter(c => c.status === 'In Progress').length;
      const resolved = complaints.filter(c => c.status === 'Resolved').length;
      const urgent = complaints.filter(c => c.priority === 'Urgent' && c.status !== 'Resolved').length;

      return `
        <div class="admin-layout">
          <!-- Mobile Backdrop -->
          <div id="admin-sidebar-backdrop" class="admin-sidebar-backdrop" style="display:none;" onclick="closeAdminSidebar()"></div>

          <!-- Sidebar -->
          <aside class="admin-sidebar" style="background:var(--bg-surface);border-right:1px solid var(--border-color);padding:1.5rem 1rem;display:flex;flex-direction:column;justify-content:space-between;">
            <div>
              <div style="display:flex;align-items:center;justify-content:space-between;padding:0 0.5rem 1.25rem 0.5rem;border-bottom:1px solid var(--border-color);margin-bottom:1rem;">
                <div>
                  <div style="font-weight:800;font-size:1.05rem;color:var(--primary);">Admin Control Center</div>
                  <div style="font-size:0.75rem;color:var(--text-muted);">${escapeHtml(db.settings.campusName)}</div>
                </div>
                <button onclick="closeAdminSidebar()" class="btn btn-secondary btn-sm" style="padding:0.35rem;" id="admin-close-sidebar-btn" title="Close Menu">
                  ${iconSvg('x', 16)}
                </button>
              </div>

    // Admin Tab: Analytics
    function renderAdminAnalyticsTab(db) {
      const complaints = db.complaints;
      const total = complaints.length;

      // Group by Category
      const catCounts = {};
      db.categories.forEach(c => catCounts[c.name] = 0);
      complaints.forEach(c => { catCounts[c.category] = (catCounts[c.category] || 0) + 1; });

      // Group by Status
      const statusCounts = { 'Pending': 0, 'Assigned': 0, 'In Progress': 0, 'Resolved': 0, 'Rejected': 0 };
      complaints.forEach(c => { if (statusCounts[c.status] !== undefined) statusCounts[c.status]++; });

      // Group by Priority
      const priorityCounts = { 'Low': 0, 'Medium': 0, 'High': 0, 'Urgent': 0 };
      complaints.forEach(c => { if (priorityCounts[c.priority] !== undefined) priorityCounts[c.priority]++; });

      // Group by Building
      const buildingCounts = {};
      complaints.forEach(c => { buildingCounts[c.building] = (buildingCounts[c.building] || 0) + 1; });

      return `
        <div>
          <div style="margin-bottom:2rem;">
            <h2 style="font-size:1.85rem;font-weight:800;letter-spacing:-0.03em;">Campus Maintenance Analytics</h2>
            <div style="font-size:0.85rem;color:var(--text-muted);">Real-time quantitative breakdowns across facilities, buildings, and technician workloads</div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem;" class="analytics-grid">
            <!-- Category Distribution -->
            <div class="card" style="padding:1.5rem;">
              <h3 style="font-size:1.05rem;font-weight:800;margin-bottom:1.25rem;">Complaints by Category</h3>
              <div style="display:flex;flex-direction:column;gap:0.75rem;">
                ${Object.keys(catCounts).map(cat => {
                  const cnt = catCounts[cat];
                  const pct = total > 0 ? Math.round((cnt / total) * 100) : 0;
                  return `
                    <div>
                      <div style="display:flex;justify-content:space-between;font-size:0.825rem;font-weight:600;margin-bottom:0.25rem;">
                        <span>${escapeHtml(cat)}</span>
                        <span style="font-family:var(--font-mono);">${cnt} (${pct}%)</span>
                      </div>
                      <div style="width:100%;height:8px;background:var(--bg-surface-subtle);border-radius:4px;overflow:hidden;">
                        <div style="width:${pct}%;height:100%;background:var(--primary);border-radius:4px;"></div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Status Distribution -->
            <div class="card" style="padding:1.5rem;">
              <h3 style="font-size:1.05rem;font-weight:800;margin-bottom:1.25rem;">Complaints by Status</h3>
              <div style="display:flex;flex-direction:column;gap:0.75rem;">
                ${Object.keys(statusCounts).map(st => {
                  const cnt = statusCounts[st];
                  const pct = total > 0 ? Math.round((cnt / total) * 100) : 0;
                  const color = st === 'Resolved' ? 'var(--success)' : st === 'In Progress' ? '#0284c7' : st === 'Pending' ? 'var(--warning)' : 'var(--primary)';
                  return `
                    <div>
                      <div style="display:flex;justify-content:space-between;font-size:0.825rem;font-weight:600;margin-bottom:0.25rem;">
                        <span>${escapeHtml(st)}</span>
                        <span style="font-family:var(--font-mono);">${cnt} (${pct}%)</span>
                      </div>
                      <div style="width:100%;height:8px;background:var(--bg-surface-subtle);border-radius:4px;overflow:hidden;">
                        <div style="width:${pct}%;height:100%;background:${color};border-radius:4px;"></div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;" class="analytics-grid">
            <!-- Priority Distribution -->
            <div class="card" style="padding:1.5rem;">
              <h3 style="font-size:1.05rem;font-weight:800;margin-bottom:1.25rem;">Urgency &amp; Priority Breakdown</h3>
              <div style="display:flex;flex-direction:column;gap:0.75rem;">
                ${Object.keys(priorityCounts).map(p => {
                  const cnt = priorityCounts[p];
                  const pct = total > 0 ? Math.round((cnt / total) * 100) : 0;
                  const color = p === 'Urgent' ? 'var(--danger)' : p === 'High' ? 'var(--warning)' : p === 'Medium' ? '#0284c7' : 'var(--text-subtle)';
                  return `
                    <div>
                      <div style="display:flex;justify-content:space-between;font-size:0.825rem;font-weight:600;margin-bottom:0.25rem;">
                        <span class="priority-${p.toLowerCase()}">${escapeHtml(p)}</span>
                        <span style="font-family:var(--font-mono);">${cnt} (${pct}%)</span>
                      </div>
                      <div style="width:100%;height:8px;background:var(--bg-surface-subtle);border-radius:4px;overflow:hidden;">
                        <div style="width:${pct}%;height:100%;background:${color};border-radius:4px;"></div>
                      </div>
                    </div>
                  `;

        drawer.style.display = isMobileNavOpen ? 'block' : 'none';

        closeNotificationsTray();
      }
      if (iconSpan) {
        iconSpan.innerHTML = isMobileNavOpen ? iconSvg('x', 18) : iconSvg('menu', 18);

    function renderNotificationsList() {
      const container = document.getElementById('notif-items-container');
      if (!container) return;
      const db = getDB();
      let notifs = db.notifications || [];

      // Update Filter button active styles and counts
      const allBtn = document.getElementById('notif-filter-all');
      const stuBtn = document.getElementById('notif-filter-student');
      const stfBtn = document.getElementById('notif-filter-staff');
      const admBtn = document.getElementById('notif-filter-admin');

      if (allBtn) {
        const totalCount = notifs.length;
        const stuCount = notifs.filter(n => n.targetRole === 'student' || n.targetRole === 'all').length;
        const stfCount = notifs.filter(n => n.targetRole === 'staff' || n.targetRole === 'all').length;
        const admCount = notifs.filter(n => n.targetRole === 'admin' || n.targetRole === 'all').length;

        allBtn.className = `btn btn-sm ${notifFilter==='all'?'btn-primary':'btn-secondary'}`;
        allBtn.innerHTML = `All (${totalCount})`;
        if (stuBtn) {
          stuBtn.className = `btn btn-sm ${notifFilter==='student'?'btn-primary':'btn-secondary'}`;
          stuBtn.innerHTML = `Student (${stuCount})`;
        }
        if (stfBtn) {
          stfBtn.className = `btn btn-sm ${notifFilter==='staff'?'btn-primary':'btn-secondary'}`;
          stfBtn.innerHTML = `Staff (${stfCount})`;
        }
        if (admBtn) {
          admBtn.className = `btn btn-sm ${notifFilter==='admin'?'btn-primary':'btn-secondary'}`;
          admBtn.innerHTML = `Admin (${admCount})`;
        }
      }

      // Filter active set if specific role tab selected
      if (notifFilter !== 'all') {
        notifs = notifs.filter(n => n.targetRole === notifFilter || n.targetRole === 'all');
      }

      if (notifs.length === 0) {
        container.innerHTML = `
          <div style="padding:2.5rem 1rem;text-align:center;color:var(--text-muted);font-size:0.8rem;">
            ${iconSvg('bell', 24)}
            <div style="margin-top:0.5rem;font-weight:600;">No notifications found</div>
            <div style="font-size:0.75rem;color:var(--text-subtle);margin-top:0.25rem;">Real-time dispatch and status updates will appear here.</div>
          </div>
        `;
        return;
      }

      container.innerHTML = notifs.map(n => {
        const roleLabel = n.targetRole === 'student' ? 'Student' : n.targetRole === 'staff' ? 'Staff' : n.targetRole === 'admin' ? 'Admin' : 'Broadcast';
        const roleColor = n.targetRole === 'student' ? 'var(--primary)' : n.targetRole === 'staff' ? 'var(--accent)' : n.targetRole === 'admin' ? '#9333ea' : 'var(--text-subtle)';
        const roleBg = n.targetRole === 'student' ? 'var(--primary-subtle)' : n.targetRole === 'staff' ? 'var(--accent-subtle)' : n.targetRole === 'admin' ? 'rgba(147, 51, 234, 0.12)' : 'var(--bg-surface-subtle)';

        return `
          <div style="padding:0.75rem 1rem;border-bottom:1px solid var(--border-color);background:${n.read ? 'transparent' : 'var(--primary-subtle)'};display:flex;gap:0.75rem;align-items:flex-start;transition:background 0.15s ease;" class="hover:bg-surface-subtle">
            <div style="color:${n.type === 'success' ? 'var(--success)' : n.type === 'urgent' ? 'var(--danger)' : 'var(--primary)'};margin-top:2px;">
              ${iconSvg(n.type === 'success' ? 'check-circle' : n.type === 'urgent' ? 'alert-triangle' : 'bell', 16)}
            </div>
            <div style="flex:1;">
              <div style="font-size:0.825rem;font-weight:${n.read ? '600' : '700'};color:var(--text-main);display:flex;justify-content:space-between;align-items:center;gap:0.35rem;">
                <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px;">${escapeHtml(n.title)}</span>
                <span style="font-size:0.62rem;font-weight:700;padding:1px 5px;border-radius:4px;background:${roleBg};color:${roleColor};text-transform:uppercase;white-space:nowrap;">${roleLabel}</span>
              </div>
              <div style="font-size:0.775rem;color:var(--text-muted);margin-top:0.2rem;line-height:1.35;">${escapeHtml(n.message)}</div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-top:0.35rem;">
                ${n.ticketId ? `
                  <button onclick="openTicketFromNotif('${n.ticketId}', '${n.id}')" style="font-size:0.72rem;color:var(--primary);background:none;border:none;cursor:pointer;font-weight:600;padding:0;display:inline-flex;align-items:center;gap:3px;">
                    Track Ticket ${escapeHtml(n.ticketId)} &rarr;
                  </button>
                ` : '<span></span>'}
                <span style="font-size:0.68rem;color:var(--text-subtle);">${escapeHtml(n.time || 'Recent')}</span>
              </div>
            </div>
            <button onclick="dismissNotification('${n.id}', event)" style="background:none;border:none;color:var(--text-subtle);cursor:pointer;padding:4px;border-radius:4px;" title="Dismiss notification" class="hover:text-danger">
              ${iconSvg('x', 13)}
            </button>
          </div>
        `;
      }).join('');
    }

    // Modal Control & Templates
    function openModal(id) {
      const el = document.getElementById(id);
      if (el) {
        if (id === 'auth-modal') {
          switchAuthTab('signin');
        } else if (id === 'admin-modal') {
          switchAdminAuthTab('signin', 'modal');
        }
        el.classList.add('active');
        document.body.style.overflow = 'hidden';
      }
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      if (el) {
        el.classList.remove('active');
        document.body.style.overflow = '';
      }
    }

    function switchAuthTab(tab) {
      const signinForm = document.getElementById('signin-form');
      const signupForm = document.getElementById('signup-form');
      const tabSignin = document.getElementById('auth-tab-signin');
      const tabSignup = document.getElementById('auth-tab-signup');
      if (tab === 'signin') {
        if (signinForm) signinForm.style.display = 'block';
        if (signupForm) signupForm.style.display = 'none';
        if (tabSignin) tabSignin.classList.add('active');
        if (tabSignup) tabSignup.classList.remove('active');
      } else {
        if (signinForm) signinForm.style.display = 'none';
        if (signupForm) signupForm.style.display = 'block';
        if (tabSignin) tabSignin.classList.remove('active');
        if (tabSignup) tabSignup.classList.add('active');
      }
    }

    function formatChatMarkdown(text) {
      if (!text) return '';
      let escaped = escapeHtml(text);
      escaped = escaped.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      escaped = escaped.replace(/(?:^|\n)[-\*]\s+(.*?)(?=\n|$)/g, '<div style="display:flex;align-items:flex-start;gap:6px;margin:3px 0;"><span style="color:#f59e0b;">&bull;</span><span>$1</span></div>');
      escaped = escaped.replace(/(?:^|\n)(\d+)\.\s+(.*?)(?=\n|$)/g, '<div style="display:flex;align-items:flex-start;gap:6px;margin:3px 0;"><span style="color:var(--primary);font-weight:700;">$1.</span><span>$2</span></div>');
      escaped = escaped.replace(/\n\n/g, '<div style="height:8px;"></div>');
      escaped = escaped.replace(/\n/g, '<br/>');
      return escaped;
    }

    function renderChatbotMessages() {
      const container = document.getElementById('chatbot-messages-container');
      if (!container) return;

      let html = '';
      chatbotMessages.forEach((msg) => {
        if (msg.role === 'user') {
          html += `

      if (chatbotLoading) {
        html += `

            <div style="width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg, #1d4ed8, #092556);color:#fff;display:flex;align-items:center;justify-content:center;">

        `;

    async function sendChatbotMessage(presetText = '') {
      const input = document.getElementById('chatbot-input');
      const text = (presetText || input?.value || '').trim();
      if (!text || chatbotLoading) return;

      if (input && !presetText) input.value = '';

      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      chatbotMessages.push({
        role: 'user',
        text: text,
        time: now
      });

      chatbotLoading = true;
      renderChatbotMessages();

      try {
        const history = chatbotMessages.slice(-6).map(m => ({
          role: m.role === 'model' ? 'model' : 'user',
          text: m.text
        }));

        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history })
        });

        const data = await response.json();
        const replyText = data.reply || data.error || 'I am having trouble answering right now. Please try again.';

        chatbotMessages.push({
          role: 'model',
          text: replyText,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
      } catch (err) {
        console.error('Chat error:', err);
        chatbotMessages.push({
          role: 'model',
          text: 'Unable to reach the CampusFix AI server. Please check your network connection and try again.',
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          isError: true
        });
      } finally {
        chatbotLoading = false;
        renderChatbotMessages();
      }
    }

    async function setView(viewName, params = {}) {
      if (viewName === 'admin-dashboard') {
        const session = getSession();
        const token = localStorage.getItem('campusfix_admin_token');
        if (!session || session.role !== 'admin' || !token) {
          showToast('Access Restricted', 'Authorized administrator authentication required.', 'warning');
          currentView = 'admin-signin';
          window.scrollTo({ top: 0, behavior: 'smooth' });
          renderApp();
          updateNavSession();
          return;
        }

        // Server-side authorization check
        try {
          const res = await fetch('/api/admin/verify', {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await res.json();
          if (!data.success) {
            clearSession();
            showToast('Session Expired', 'Please sign in with your authorized admin credentials.', 'danger');
            currentView = 'admin-signin';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderApp();
            updateNavSession();
            return;
          }
        } catch (e) {
          console.warn('Backend session verification check:', e);
        }
      }

      if (viewName === 'student-dashboard' || viewName === 'complaint-history') {
        const session = getSession();
        if (!session || session.role !== 'student') {
          showToast('Sign In Required', 'Please sign in to access your student maintenance dashboard.', 'info');
          currentView = 'student-signin';
          window.scrollTo({ top: 0, behavior: 'smooth' });
          renderApp();
          updateNavSession();
          return;
        }
      }

      isMobileNavOpen = false;
      closeNotificationsTray();
      currentView = viewName;
