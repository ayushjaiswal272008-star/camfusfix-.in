<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Left Blue Segment -->
  <rect x="0" y="0" width="135" height="140" fill="#0b3882" rx="4" />
  
  <!-- GNIOT Crest Emblem Seal -->
  <g transform="translate(67.5, 48)">
    <!-- Outer Shield / Circle -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#ffffff" stroke-width="2.2" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="2,1.5" />
    <circle cx="0" cy="0" r="24" fill="#092d6b" stroke="#ffffff" stroke-width="1.5" />
    
    <!-- Torch of Learning & Rays -->
    <path d="M-2.5, -4 L2.5, -4 L1.5, 10 L-1.5, 10 Z" fill="#ffffff" />
    <path d="M0, -14 C-4, -9 -1, -5 0, -4 C1, -5 4, -9 0, -14 Z" fill="#facc15" />
    
    <!-- Open Book of Knowledge -->
    <path d="M-12, 10 Q-6, 7 0, 10 Q6, 7 12, 10 L11, 14 Q6, 11 0, 13 Q-6, 11 -11, 14 Z" fill="#ffffff" />
    <line x1="0" y1="10" x2="0" y2="13" stroke="#092d6b" stroke-width="1" />
    
    <!-- Subtle Gear Teeth representing Technology -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,3" />

    <!-- Ribbon Motto Banner -->
    <path d="M-26, 21 Q0, 16 26, 21 L23, 27 Q0, 22 -23, 27 Z" fill="#ffffff" />
    <text x="0" y="25" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="4" font-weight="800" fill="#0b3882">योगः कर्मसु कौशलम्</text>
  </g>

  <!-- Crest Bottom Text Labels -->
  <text x="67.5" y="98" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="14.5" letter-spacing="0.06em">GNIOT</text>
  <text x="67.5" y="112" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="9" letter-spacing="0.02em">Group of Institutions</text>
  <text x="67.5" y="126" text-anchor="middle" fill="#cbd5e1" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="8.5" letter-spacing="0.08em">Since 2001</text>

  <!-- Right Golden Yellow Segment -->
  <rect x="135" y="0" width="505" height="140" fill="#fbb016" rx="4" />

  <!-- Divider Line -->
  <line x1="135" y1="0" x2="135" y2="140" stroke="#0b3882" stroke-width="2" />

  <!-- Bold Primary Title: GNIOT -->
  <text x="156" y="66" fill="#0f3478" font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="64" letter-spacing="0.025em">GNIOT</text>

  <!-- Subtitle: GROUP OF INSTITUTIONS -->
  <text x="158" y="98" fill="#133675" font-family="'Plus Jakarta Sans', 'Arial Black', Arial, sans-serif" font-weight="900" font-size="24.5" letter-spacing="0.06em">GROUP OF INSTITUTIONS</text>

  <!-- Accreditation & Affiliations Text -->
  <text x="158" y="122" fill="#9a3412" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="11.5" letter-spacing="0.01em">Approved by AICTE &amp; PCI, New Delhi and Affiliated to AKTU-Lucknow, GGSIPU-New Delhi &amp; BTE-Lucknow</text>
</svg>
